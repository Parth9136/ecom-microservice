
spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5433/product
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

